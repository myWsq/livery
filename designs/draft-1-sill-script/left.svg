<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 5200 1800" width="5200mm" height="1800mm">
  <!-- Draft 1, sill script, LEFT. 1 user unit = 1 mm.
       u (to the right) = 2600 - 1000 * x, v (down) = 1600 - 1000 * y, car frame in metres. Drawn for the Porsche 911 (992). -->

  <!-- Drawing aid only: the workshop removes this group before the artboard reaches the car. -->
  <g id="guide">
    <image xlink:href="../_guides/left.png" x="0" y="0" width="5200" height="1800" />
  </g>

  <!-- A black band low between the wheels, the name cut out of it so the silver shows through. -->
  <defs>
    <mask id="script">
      <rect x="0" y="0" width="5200" height="1800" fill="white" />
      <text x="2650" y="1378" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="168" font-weight="bold" letter-spacing="74" fill="black">NEUNELF</text>
    </mask>
  </defs>
  <rect x="1780" y="1196" width="1740" height="226" fill="#16181b" mask="url(#script)" />
</svg>
