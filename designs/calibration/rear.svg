<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 2400 1800" width="2400mm" height="1800mm">
  <!-- Calibration artboard, REAR. 1 user unit = 1 mm.
       u (to the right) = 1200 + 1000 * z, v (down) = 1600 - 1000 * y, car frame in metres. -->

  <!-- Drawing aid only: the workshop removes this group before the artboard reaches the car. -->
  <g id="guide">
    <image xlink:href="../_guides/rear.png" x="0" y="0" width="2400" height="1800" />
  </g>

  <defs>
    <pattern id="grid-100" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M0 0H100M0 100H100M0 0V100M100 0V100" fill="none" stroke="#16181c" stroke-width="6" />
    </pattern>
    <pattern id="grid-500" width="500" height="500" patternUnits="userSpaceOnUse">
      <path d="M0 0H500M0 500H500M0 0V500M500 0V500" fill="none" stroke="#16181c" stroke-width="14" />
    </pattern>
  </defs>

  <!-- Grid: a line every 100 mm, a heavier one every 500 mm. -->
  <rect width="2400" height="1800" fill="url(#grid-100)" />
  <rect width="2400" height="1800" fill="url(#grid-500)" />

  <!-- Millimetre values of the heavy lines. -->
  <g font-family="sans-serif" font-size="36" fill="#16181c">
    <text x="514" y="988">u 500</text>
    <text x="1014" y="988">u 1000</text>
    <text x="1514" y="988">u 1500</text>
    <text x="2014" y="988">u 2000</text>
    <text x="1214" y="488">v 500</text>
    <text x="1214" y="1040">v 1000</text>
    <text x="1214" y="1488">v 1500</text>
  </g>

  <!-- View name, and an arrow pointing up. -->
  <g font-family="sans-serif" font-weight="bold" fill="#16181c">
    <text x="1200" y="1180" font-size="170" text-anchor="middle">REAR</text>
    <path d="M700 900l50 80h-32v170h-36v-170h-32z" />
    <text x="770" y="1150" font-size="70">UP</text>
  </g>

  <!-- Markers at stated positions; no two artboards share a layout. -->
  <circle cx="1720" cy="950" r="40" fill="#e6002d" />                   <!-- red: centre (1720, 950) -->
  <rect x="1600" y="1070" width="60" height="60" fill="#19c832" />      <!-- green: corner (1600, 1070) -->
</svg>
