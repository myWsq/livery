<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 5200 2400" width="5200mm" height="2400mm">
  <!-- Draft 2, Le Mans stripes, TOP. 1 user unit = 1 mm.
       u (to the right) = 2600 - 1000 * x, v (down) = 1200 - 1000 * z, car frame in metres. Drawn for the Porsche 911 (992). -->

  <!-- Drawing aid only: the workshop removes this group before the artboard reaches the car. -->
  <g id="guide">
    <image xlink:href="../_guides/top.png" x="0" y="0" width="5200" height="2400" />
  </g>

  <!-- Two wide stripes on the centreline, bonnet to tail, with thin pinstripes outside. -->
  <rect x="0" y="1580" width="5200" height="12" fill="#1b2a4a" />
  <rect x="0" y="1240" width="5200" height="220" fill="#1b2a4a" />
  <rect x="0" y="940" width="5200" height="220" fill="#1b2a4a" />
  <rect x="0" y="808" width="5200" height="12" fill="#1b2a4a" />
</svg>
