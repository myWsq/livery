<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>livery · 工坊</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #000;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #error {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #ddd;
        font:
          14px/1.6 system-ui,
          sans-serif;
        text-align: center;
      }
      #error[hidden] {
        display: none;
      }
      /* The notices stack in the bottom-left corner, so neither covers the other. */
      #notices {
        position: fixed;
        left: 16px;
        bottom: 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-width: min(560px, calc(100vw - 32px));
      }
      #artboard-notice,
      #environment-notice {
        padding: 10px 14px;
        border-left: 3px solid #f0b429;
        border-radius: 4px;
        background: rgb(18 20 24 / 88%);
        color: #e8e8e8;
        font:
          13px/1.6 system-ui,
          sans-serif;
      }
      #artboard-notice[hidden],
      #environment-notice[hidden] {
        display: none;
      }
      #artboard-notice p {
        margin: 0 0 4px;
        color: #f0b429;
      }
      #artboard-notice ul,
      #environment-notice ul {
        margin: 0;
        padding-left: 18px;
      }
      #artboard-notice li,
      #environment-notice li {
        overflow-wrap: anywhere;
      }
      #artboard-notice code {
        font:
          12px/1.6 ui-monospace,
          monospace;
      }
      #design-label {
        position: fixed;
        left: 16px;
        top: 16px;
        display: flex;
        gap: 12px;
        padding: 4px 10px;
        border-radius: 4px;
        background: rgb(18 20 24 / 60%);
        color: #e8e8e8;
        font:
          13px/1.6 system-ui,
          sans-serif;
        pointer-events: none;
        user-select: none;
      }
      #design-label[hidden] {
        display: none;
      }
      #design-label .position,
      #design-label .separator,
      #design-label .environment-position {
        color: #9aa0a8;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <div id="error" hidden></div>
    <div id="design-label" role="status" hidden>
      <span class="name"></span><span class="position"></span>
      <span class="separator" aria-hidden="true">·</span>
      <span class="environment-name"></span><span class="environment-position"></span>
    </div>
    <div id="notices">
      <aside id="artboard-notice" role="status" hidden>
        <p>下列画板无法显示，车身保留它们上一次成功的画面：</p>
        <ul></ul>
      </aside>
      <aside id="environment-notice" role="status" hidden>
        <ul></ul>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
